<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Headphone band -->
  <path d="M150 270 Q150 160 256 140 Q362 160 362 270" stroke="white" stroke-width="24" fill="none" stroke-linecap="round"/>
  <!-- Left ear cup -->
  <rect x="120" y="250" width="50" height="80" rx="14" fill="white"/>
  <!-- Right ear cup -->
  <rect x="342" y="250" width="50" height="80" rx="14" fill="white"/>
  <!-- Sound waves from right -->
  <path d="M410 270 Q430 290 410 310" stroke="white" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.9"/>
  <path d="M425 255 Q455 290 425 325" stroke="white" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M440 240 Q480 290 440 340" stroke="white" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.5"/>
  <!-- ISW text -->
  <text x="256" y="420" font-family="Arial,Helvetica,sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="8">ISW</text>
</svg>
