name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Checkout LFS objects
        run: git lfs checkout

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compute release version
        id: version
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          MAJOR_MINOR=$(echo "$BASE_VERSION" | awk -F. '{print $1 "." $2}')
          RELEASE_VERSION="${MAJOR_MINOR}.${GITHUB_RUN_NUMBER}"
          echo "release_version=$RELEASE_VERSION" >> $GITHUB_OUTPUT
          echo "release_code=$GITHUB_RUN_NUMBER" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: npm ci

      - name: Stamp release version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          RELEASE_CODE: ${{ steps.version.outputs.release_code }}
        run: node scripts/stamp-version.js

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle wrapper
        working-directory: webview-apk
        run: gradle wrapper --gradle-version 8.5

      - name: Make gradlew executable
        run: chmod +x webview-apk/gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > webview-apk/app/isw-release-key.jks
          echo "KEYSTORE_AVAILABLE=true" >> $GITHUB_ENV

      - name: Build Signed APK
        if: ${{ env.KEYSTORE_AVAILABLE == 'true' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd webview-apk && ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/isw-release-key.jks \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Build Unsigned APK
        if: ${{ env.KEYSTORE_AVAILABLE != 'true' }}
        run: cd webview-apk && ./gradlew assembleRelease

      - name: Find and rename APK
        run: |
          VERSION="${{ steps.version.outputs.release_version }}"
          APK=$(find webview-apk/app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK" "ISW-English-v${VERSION}.apk"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.release_version }}
          name: v${{ steps.version.outputs.release_version }}
          target_commitish: ${{ github.sha }}
          files: ISW-English-*.apk
          generate_release_notes: true
          body: |
            ## ISW 영어 듣고 말하기 v${{ steps.version.outputs.release_version }}

            ### 포함 사항
            - Cloudflare Pages 배포 웹앱
            - D1 기반 자체 인증과 진도 동기화
            - WebView 기반 Android APK
            - PWA 설치 지원(iOS/Android)
            - 앱 내 GitHub Releases 업데이트 체크

            ### Android 설치
            1. APK 파일 다운로드
            2. 알 수 없는 앱 설치 허용 후 설치
            3. 이후 앱에서 새 릴리스를 자동 감지

            ### iOS / 웹
            https://iwlisten.pages.dev/
